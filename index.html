<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Cadastro de Celebridades</title>
</head>
<body>
    <h1>Cadastro de Celebridades</h1>

    <form id="formulario">
        <input type="text" id="campoNome" placeholder="Nome da celebridade" required>
        <input type="text" id="campoAtuacao" placeholder="Área de atuação" required>
        <input type="text" id="campoNacionalidade" placeholder="Nacionalidade" required>
        <input type="text" id="campoIdade" placeholder="Idade" required>
        <button type="submit">Cadastrar</button>
    </form>

    <table>
        <thead>
            <th>Nome</th>
            <th>Atuação</th>
            <th>Nacionalidade</th>
            <th>Idade</th>
        </thead>
        <tbody id="corpoTabela">
        </tbody>
    </table>

    <script src="main.js"></script>
</body>
</html>
